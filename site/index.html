<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>im — just chat.</title>
    <meta name="description" content="An ultra-lightweight, native macOS chat client for LLMs. Your providers, your models, plain JSON files." />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="im — just chat." />
    <meta property="og:description" content="An ultra-lightweight, native macOS chat client for LLMs." />
    <meta property="og:image" content="https://im.linghaoz.com/icon.png" />
    <link rel="icon" href="icon.png" />
    <link rel="apple-touch-icon" href="icon.png" />
    <style>
      :root {
        color-scheme: light dark;
        --label: light-dark(rgba(0, 0, 0, 0.88), rgba(255, 255, 255, 0.88));
        --secondary: light-dark(rgba(0, 0, 0, 0.5), rgba(255, 255, 255, 0.55));
        --tertiary: light-dark(rgba(0, 0, 0, 0.28), rgba(255, 255, 255, 0.3));
        --separator: light-dark(rgba(0, 0, 0, 0.1), rgba(255, 255, 255, 0.12));
        --canvas: light-dark(#ffffff, #1e1e20);
        --code-bg: light-dark(#f5f5f6, #29292c);
        --fill: light-dark(rgba(0, 0, 0, 0.05), rgba(255, 255, 255, 0.075));
        --accent: light-dark(#007aff, #0a84ff);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--canvas);
        color: var(--label);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 64px 24px 88px;
        text-align: center;
      }
      .icon {
        width: 96px;
        height: 96px;
        margin-bottom: 28px;
      }
      h1 {
        margin: 0 0 14px;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
        font-size: 52px;
        line-height: 1;
        font-weight: 500;
        letter-spacing: -0.03em;
      }
      h1 .dot {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-left: 6px;
        border-radius: 50%;
        background: var(--accent);
        vertical-align: 0;
      }
      .lede {
        max-width: 34em;
        margin: 0 0 40px;
        font-size: 17px;
        line-height: 1.5;
        color: var(--secondary);
      }
      .install {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        max-width: 100%;
        padding: 12px 12px 12px 18px;
        border: 1px solid var(--separator);
        border-radius: 12px;
        background: var(--code-bg);
        font: 13.5px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
        color: var(--label);
        text-align: left;
        cursor: default;
        user-select: all;
        -webkit-user-select: all;
        transition: border-color 120ms ease;
      }
      .install:hover {
        border-color: light-dark(rgba(0, 0, 0, 0.2), rgba(255, 255, 255, 0.25));
      }
      .install code {
        font: inherit;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .install .prompt {
        color: var(--tertiary);
        margin-right: 9px;
      }
      .copy {
        flex: none;
        padding: 3px 10px;
        border: 1px solid var(--separator);
        border-radius: 7px;
        background: var(--canvas);
        color: var(--secondary);
        font: 12px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        cursor: default;
        user-select: none;
        -webkit-user-select: none;
      }
      .copy:hover {
        color: var(--label);
      }
      .alt {
        margin: 18px 0 0;
        font-size: 13px;
        color: var(--tertiary);
      }
      .alt a {
        color: var(--secondary);
        text-decoration: none;
        border-bottom: 1px solid var(--separator);
      }
      .alt a:hover {
        color: var(--label);
        border-bottom-color: var(--secondary);
      }
      footer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 20px 24px;
        display: flex;
        justify-content: center;
        gap: 18px;
        font-size: 12px;
        color: var(--tertiary);
        background: linear-gradient(to top, var(--canvas) 60%, transparent);
        pointer-events: none;
      }
      footer a {
        color: inherit;
        text-decoration: none;
        pointer-events: auto;
      }
      footer a:hover {
        color: var(--secondary);
      }
      @media (max-width: 560px) {
        h1 {
          font-size: 42px;
        }
        .install {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="icon" src="icon.png" alt="" width="96" height="96" />
      <h1>just chat<span class="dot"></span></h1>
      <p class="lede">An ultra-lightweight, native macOS chat client for LLMs.<br />Your providers, your models, plain JSON files.</p>
      <div class="install" id="install" title="Click to copy">
        <code><span class="prompt">$</span>curl -fsSL https://im.linghaoz.com/install.sh | sh</code>
        <button class="copy" id="copy" type="button">Copy</button>
      </div>
      <p class="alt">or download the <a href="https://github.com/yetlinghao/im/releases/latest">disk image</a> · macOS 13+ · Apple silicon and Intel</p>
    </main>
    <footer>
      <a href="https://github.com/yetlinghao/im">Source on GitHub</a>
      <a href="https://github.com/yetlinghao/im/releases">Releases</a>
    </footer>
    <script>
      const cmd = "curl -fsSL https://im.linghaoz.com/install.sh | sh";
      const btn = document.getElementById("copy");
      const copy = () =>
        navigator.clipboard.writeText(cmd).then(() => {
          btn.textContent = "Copied";
          setTimeout(() => (btn.textContent = "Copy"), 1200);
        });
      btn.addEventListener("click", (e) => (e.stopPropagation(), copy()));
      document.getElementById("install").addEventListener("click", copy);
    </script>
  </body>
</html>
