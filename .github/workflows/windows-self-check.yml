name: windows-self-check

on:
  push:
    branches: ["codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-self-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run biome:check
      - run: npm run typecheck
      - run: npm test

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --debug --ci --bundles nsis --config .github/tauri-ci.json
      - name: Main window close exits the Windows app
        shell: pwsh
        env:
          IM_SCENARIO: close
        run: |
          $env:IM_DATA_DIR = Join-Path $env:RUNNER_TEMP "im-close-smoke"
          $process = Start-Process -FilePath "src-tauri/target/debug/im.exe" -PassThru -WindowStyle Hidden
          try {
            if (-not $process.WaitForExit(20000)) {
              throw "im.exe did not exit after the main window closed."
            }
            if ($process.ExitCode -ne 0) {
              throw "im.exe exited with code $($process.ExitCode)."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: im-windows-x64-debug
          path: src-tauri/target/debug/bundle/nsis/*.exe
          if-no-files-found: error
