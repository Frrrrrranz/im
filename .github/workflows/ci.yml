name: ci

on:
  push:
    branches: [main, codex/provider-reliability]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run biome:check
      - run: npm run typecheck
      - run: npm test

  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            bundle: app
          - name: Windows x64
            os: windows-2022
            bundle: nsis
    runs-on: ${{ matrix.os }}
    env:
      # Match tauri.conf.json so Cargo checks and Tauri reuse macOS dependencies.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Check Rust formatting
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          if ! git diff --quiet -- src-tauri; then
            {
              echo '## rustfmt patch'
              echo '```diff'
              git diff -- src-tauri
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            patch=$(git diff -- src-tauri | gzip -c | base64 | tr -d '\n')
            chunk_size=3000
            chunk_index=0
            while [ $((chunk_index * chunk_size)) -lt ${#patch} ]; do
              chunk_start=$((chunk_index * chunk_size))
              chunk_title=$(printf 'rustfmt patch chunk %04d' "$chunk_index")
              echo "::error title=$chunk_title::${patch:$chunk_start:$chunk_size}"
              chunk_index=$((chunk_index + 1))
            done
            exit 1
          fi
      - run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      # PRs, including forks, build installers without access to the signing key.
      - run: npm run tauri build -- --debug --ci --bundles ${{ matrix.bundle }} --config .github/tauri-ci.json
      - name: Main window close exits the Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          IM_SCENARIO: close
        run: |
          $env:IM_DATA_DIR = Join-Path $env:RUNNER_TEMP "im-close-smoke"
          $process = Start-Process -FilePath "src-tauri/target/debug/im.exe" -PassThru -WindowStyle Hidden
          try {
            if (-not $process.WaitForExit(20000)) {
              throw "im.exe did not exit after the main window closed."
            }
            if ($process.ExitCode -ne 0) {
              throw "im.exe exited with code $($process.ExitCode)."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: im-windows-x64-debug
          path: src-tauri/target/debug/bundle/nsis/*.exe
          if-no-files-found: error
